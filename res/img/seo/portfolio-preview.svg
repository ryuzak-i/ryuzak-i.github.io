<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
  <title id="title">Oleksandr Danchenko — Software Engineer portfolio</title>
  <desc id="description">Social preview card for Ryuzaki's software engineering and game development portfolio.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop stop-color="#07101E"/>
      <stop offset="0.58" stop-color="#0D1B30"/>
      <stop offset="1" stop-color="#122C4D"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientTransform="translate(1010 88) rotate(120) scale(520 440)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2477C9" stop-opacity="0.52"/>
      <stop offset="1" stop-color="#2477C9" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ring" x1="770" y1="130" x2="1130" y2="490" gradientUnits="userSpaceOnUse">
      <stop stop-color="#6CB6FF"/>
      <stop offset="0.55" stop-color="#2477C9"/>
      <stop offset="1" stop-color="#153E71"/>
    </linearGradient>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0V44" fill="none" stroke="#7BB9F5" stroke-opacity="0.07"/>
    </pattern>
    <clipPath id="avatar-clip">
      <circle cx="950" cy="312" r="166"/>
    </clipPath>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="22" stdDeviation="24" flood-color="#02060D" flood-opacity="0.55"/>
    </filter>
  </defs>

  <rect width="1200" height="630" rx="0" fill="url(#background)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <circle cx="1130" cy="560" r="310" fill="none" stroke="#4B91D5" stroke-opacity="0.2" stroke-width="2"/>
  <circle cx="1130" cy="560" r="250" fill="none" stroke="#4B91D5" stroke-opacity="0.13" stroke-width="2"/>
  <path d="M0 548C218 510 324 621 528 579C679 548 747 450 848 427" fill="none" stroke="#4895DF" stroke-opacity="0.12" stroke-width="2"/>

  <g font-family="Segoe UI, Arial, sans-serif">
    <g transform="translate(76 64)">
      <rect width="52" height="52" rx="15" fill="#2477C9"/>
      <path d="M15 38V14H27.5C34.8 14 39 17.8 39 24C39 28.1 36.8 31.2 32.9 32.8L40 38H32.6L26.5 33.5H21V38H15ZM21 28.2H27.1C30.8 28.2 32.9 26.8 32.9 24.1C32.9 21.4 30.8 20 27.1 20H21V28.2Z" fill="white"/>
      <text x="70" y="22" fill="#EAF4FF" font-size="20" font-weight="700" letter-spacing="3">RYUZAKI</text>
      <text x="70" y="45" fill="#8EA9C3" font-size="13" font-weight="600" letter-spacing="2.2">PORTFOLIO</text>
    </g>

    <text x="76" y="245" fill="#A7C5E3" font-size="20" font-weight="600" letter-spacing="4">OLEKSANDR</text>
    <text x="73" y="309" fill="#F4F8FC" font-size="55" font-weight="700" letter-spacing="0.5">DANCHENKO</text>
    <rect x="76" y="336" width="68" height="5" rx="2.5" fill="#2477C9"/>
    <text x="76" y="392" fill="#68B3FA" font-size="34" font-weight="600">Software Engineer</text>
    <text x="76" y="435" fill="#B8CADC" font-size="20" font-weight="500">Python Developer  •  Game Developer</text>

    <g transform="translate(76 474)" font-size="15" font-weight="600">
      <g>
        <rect width="104" height="40" rx="20" fill="#152B44" stroke="#31597F"/>
        <text x="52" y="26" fill="#D7E8F7" text-anchor="middle">Python</text>
      </g>
      <g transform="translate(116)">
        <rect width="122" height="40" rx="20" fill="#152B44" stroke="#31597F"/>
        <text x="61" y="26" fill="#D7E8F7" text-anchor="middle">JavaScript</text>
      </g>
      <g transform="translate(250)">
        <rect width="84" height="40" rx="20" fill="#152B44" stroke="#31597F"/>
        <text x="42" y="26" fill="#D7E8F7" text-anchor="middle">Unity</text>
      </g>
      <g transform="translate(346)">
        <rect width="148" height="40" rx="20" fill="#152B44" stroke="#31597F"/>
        <text x="74" y="26" fill="#D7E8F7" text-anchor="middle">Unreal Engine</text>
      </g>
    </g>

    <text x="76" y="577" fill="#7894AF" font-size="17" font-weight="600" letter-spacing="1.2">RYUZAK-I.GITHUB.IO</text>
  </g>

  <g filter="url(#shadow)">
    <circle cx="950" cy="312" r="187" fill="#0A1627" stroke="#325879" stroke-width="2"/>
    <circle cx="950" cy="312" r="174" fill="none" stroke="url(#ring)" stroke-width="8"/>
    <image href="../avatar.webp" x="784" y="146" width="332" height="332" preserveAspectRatio="xMidYMid slice" clip-path="url(#avatar-clip)"/>
    <circle cx="1084" cy="443" r="27" fill="#2477C9" stroke="#0A1627" stroke-width="8"/>
    <path d="M1072 443L1081 452L1097 433" fill="none" stroke="white" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
