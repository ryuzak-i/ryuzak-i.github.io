<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
  <title id="title">Oleksandr Danchenko — Software Engineer portfolio</title>
  <desc id="description">Oleksandr Danchenko, also known as Ryuzaki. Software engineer and game developer. A dark portfolio card with large typography, soft blue accents and a square portrait.</desc>
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&amp;family=Manrope:wght@400;600&amp;display=block');
      text { font-family: 'JetBrains Mono', Consolas, monospace; }
      .body { font-family: 'Manrope', 'Segoe UI', sans-serif; }
    </style>
    <radialGradient id="ambient" cx="85%" cy="40%" r="75%">
      <stop stop-color="#223651" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#0e141c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="portrait-border" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#7898c6"/>
      <stop offset="0.5" stop-color="#425d82"/>
      <stop offset="1" stop-color="#28364c"/>
    </linearGradient>
    <clipPath id="portrait-clip">
      <rect x="748" y="120" width="368" height="368" rx="12"/>
    </clipPath>
  </defs>
  <rect width="1200" height="630" fill="#0b0e14"/>
  <rect x="28" y="28" width="1144" height="574" rx="18" fill="#0e141c"/>
  <rect x="28" y="28" width="1144" height="574" rx="18" fill="url(#ambient)" stroke="#293547"/>
  <!-- Large, simple typography stays readable in compact social previews. -->
  <text x="80" y="127" fill="#aab6c7" font-size="26">«Ryuzaki»</text>
  <g fill="#edf1f8" font-size="76" font-weight="600" letter-spacing="-3">
    <text x="76" y="230">Oleksandr</text>
    <text x="76" y="322">Danchenko</text>
  </g>
  <text x="80" y="398" fill="#a5c2ff" font-size="32" font-weight="600">Software Engineer</text>
  <text class="body" x="80" y="443" fill="#b2bfd1" font-size="25">Game Developer</text>
  <rect x="744" y="116" width="376" height="376" rx="16" fill="url(#portrait-border)"/>
  <image href="../avatar.webp" x="748" y="120" width="368" height="368" preserveAspectRatio="xMidYMid slice" clip-path="url(#portrait-clip)"/>
  <text x="80" y="552" fill="#9abaff" font-size="22">ryuzak-i.github.io</text>
  <text class="body" x="1120" y="552" fill="#aab6c7" font-size="20" text-anchor="end">Portfolio &amp; CV</text>
</svg>
