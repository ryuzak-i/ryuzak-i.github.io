<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48">
    <!-- Original vector interpretation of the reference; hotspot: blade tip (3, 3). -->
    <defs>
        <linearGradient id="blade-steel" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0" stop-color="#607b90"/>
            <stop offset="0.3" stop-color="#a5b6bf"/>
            <stop offset="0.7" stop-color="#7e919c"/>
            <stop offset="1" stop-color="#d6ddda"/>
        </linearGradient>
        <linearGradient id="blade-core" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0" stop-color="#232a30"/>
            <stop offset="0.5" stop-color="#494b48"/>
            <stop offset="1" stop-color="#292e30"/>
        </linearGradient>
        <linearGradient id="grip-wrap" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0" stop-color="#827f72"/>
            <stop offset="0.55" stop-color="#e4dfc9"/>
            <stop offset="1" stop-color="#a09e8e"/>
        </linearGradient>
    </defs>
    <g transform="translate(3 3) rotate(-45)" stroke-linejoin="round">
        <!-- Blade widens toward the guard; core and bevels follow the same taper. -->
        <path d="M0 0 3 3.8 4.6 39H-4.6L-3 3.8Z" fill="url(#blade-steel)" stroke="#25313a" stroke-width="0.55"/>
        <path d="M0 2.2 1.6 4.8 2.65 38.2H-2.65L-1.6 4.8Z" fill="url(#blade-core)" stroke="#56626a" stroke-width="0.4"/>
        <path d="M0 0.4 2.7 4 4.3 38.7" fill="none" stroke="#dce5e4" stroke-width="0.4"/>
        <path d="M-2.7 4-4.3 38.7" fill="none" stroke="#9fb7c5" stroke-width="0.4"/>

        <!-- Restrained wear marks remain readable at cursor size. -->
        <path d="M-1.4 10.5-0.6 11M0.7 15.4 1.6 15.8M-1.8 21-0.9 21.4M0.4 26 1.5 26.4M-1.4 32-0.4 32.4"
            fill="none" stroke="#99998a" stroke-width="0.4" opacity="0.45"/>
        <path d="M2.4 19 3.4 18M-3.8 29-2.6 29.7" fill="none" stroke="#394c5a" stroke-width="0.4"/>

        <!-- Long cloth-bound grip and a squared metal pommel. -->
        <path d="M-1.45 39H1.45V53H-1.45Z" fill="url(#grip-wrap)" stroke="#303637" stroke-width="0.5"/>
        <path d="M-1.3 40 1.3 41.1M-1.3 42 1.3 43.1M-1.3 44 1.3 45.1M-1.3 46 1.3 47.1M-1.3 48 1.3 49.1M-1.3 50 1.3 51.1M-1.3 52 1.3 52.8"
            fill="none" stroke="#787b71" stroke-width="0.5"/>
        <path d="M-1.3 40.5 1.3 41.6M-1.3 44.5 1.3 45.6M-1.3 48.5 1.3 49.6"
            fill="none" stroke="#f1ead7" stroke-width="0.35"/>
        <path d="M-1.6 53H1.6L2.15 56H-2.15Z" fill="url(#blade-steel)" stroke="#283137" stroke-width="0.6"/>

        <!-- Compact arched guard rather than a projecting crossguard. -->
        <path d="M-3.5 39A3.5 3.5 0 0 1 3.5 39Z" fill="#747c7b" stroke="#252c30" stroke-width="0.65"/>
        <path d="M-2.9 38.7A2.9 2.9 0 0 1 2.9 38.7" fill="none" stroke="#d2d5c9" stroke-width="0.5"/>
        <path d="M-0.65 37.7H0.65V40H-0.65Z" fill="#313a3e" stroke="#bcc8c7" stroke-width="0.4"/>
    </g>
</svg>
